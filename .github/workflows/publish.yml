name: publish
# Publishes to npm with build provenance when a v* tag is pushed.
#
# Auth is npm Trusted Publishing (OIDC) — no token, nothing to rotate.
# Configured on npmjs.com: linework → Settings → Trusted Publisher →
# GitHub Actions, repo isaacrowntree/linework, workflow publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC — trusted publishing + provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm publish --provenance --access public
